name: PR reservation tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  reservation-tests:
    name: Reservation tests (9)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m venv .venv
          # Shared fixtures need the dev group and two currently undeclared runtime imports.
          .venv/bin/python -m pip install --index-url https://pypi.org/simple -e "./backend[dev]" "aiohttp>=3.13.5" "pytest-aiohttp>=1.1.0" Pillow pyzmq

      - name: Run reservation tests
        env:
          HF_HOME: ${{ runner.temp }}/hf-test-home
        run: |
          bash scripts/test.sh -q \
            tests/unit/test_push_state.py \
            tests/api/test_cloud_routes.py::test_delete_dataset_409_when_push_in_flight
